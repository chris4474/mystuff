- name: Création dynamique d'une base de données MariaDB
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Créer la base de données si elle n'existe pas
      ansible.mysql.mysql_db:
        name: "{{ target_db_name }}"
        state: present
        login_host: "{{ db_host }}"
        login_user: root
        login_password: "{{ db_root_password }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: Créer l'utilisateur associé et lui donner les droits
      ansible.mysql.mysql_user:
        name: "{{ target_db_user }}"
        password: "{{ target_db_pass }}"
        priv: "{{ target_db_name }}.*:ALL"
        host: "%"
        state: present
        login_host: "{{ db_host }}"
        login_user: root
        login_password: "{{ db_root_password }}"

    - name: Vérifier si la table calendars existe déjà
      ansible.builtin.shell: mariadb --skip-ssl -h {{ db_host }} -u {{ target_db_user }} -p'{{ target_db_pass }}' {{ target_db_name }} -e "SHOW TABLES LIKE 'calendars';"
      register: table_check
      changed_when: false

    - name: Importer le fichier SQL initial dans la base Baikal
      ansible.builtin.shell: mariadb --skip-ssl -h {{ db_host }} -u {{ target_db_user }} -p'{{ target_db_pass }}' {{ target_db_name }} < baikal.sql
      args:
        chdir: /workspace/playbooks
      when: table_check.stdout == ""
